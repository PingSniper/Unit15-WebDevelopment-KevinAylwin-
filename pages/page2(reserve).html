<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Table - Paw & Whiskers Café</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Local layouts specific to the layout form */
    .reserve-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 60px 24px;
    }

    .back-link {
      display: inline-block;
      color: #d9745b;
      text-decoration: none;
      font-weight: bold;
      margin-bottom: 30px;
    }

    /* Cozy form card wrapping */
    .booking-card {
      background: #fbf0e3;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(61, 52, 46, 0.05);
      margin-top: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    .form-group label {
      font-size: 0.9rem;
      font-weight: bold;
      color: #3d342e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input, 
    .form-group select {
      padding: 14px;
      border: 2px solid #ecdcc9;
      border-radius: 10px;
      background: #ffffff;
      font-size: 1rem;
      color: #3d342e;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .form-group input:focus, 
    .form-group select:focus {
      border-color: #d9745b; /* Accent glow focus ring */
    }

    /* Submit action button */
    .submit-btn {
      width: 100%;
      background: #3d342e;
      color: #fffbf4;
      border: none;
      padding: 16px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(61, 52, 46, 0.15);
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: #d9745b;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(217, 116, 91, 0.3);
    }
  </style>
</head>
<body style="background: #f4eae1;">

  <div class="reserve-container">
    <a href="index.html" class="back-link">← BACK TO HOME</a>
    
    <h1 style="color: #3d342e; font-size: 2.5rem; line-height: 1.2;">RESERVE YOUR COZY SPOT</h1>
    <p style="color: #61554d; margin-top: 8px;">Spaces are limited to keep our furry friends calm and comfortable.</p>

    <!-- Interactive Interactive Reservation Form -->
    <div class="booking-card">
      <form action="#" method="POST" onsubmit="alert('Purr-fect! Your table request has been received.'); return false;">
        
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" required placeholder="e.g. Alex Green" />
        </div>

        <div class="form-group">
          <label for="guests">Number of Guests</label>
          <select id="guests" required>
            <option value="1">1 Person</option>
            <option value="2" selected>2 People</option>
            <option value="3">3 People</option>
            <option value="4">4 People</option>
            <option value="5">5+ People (Event Room)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" required />
        </div>

        <div class="form-group">
          <label for="time">Time Slot</label>
          <select id="time" required>
            <option value="morning">10:00 AM - 12:00 PM (Morning Cuddles)</option>
            <option value="noon">12:30 PM - 2:30 PM (Midday Lounge)</option>
            <option value="afternoon">3:00 PM - 5:00 PM (Afternoon Tea)</option>
            <option value="evening">5:30 PM - 7:30 PM (Sunset Purrs)</option>
          </select>
        </div>

        <button type="submit" class="submit-btn">CONFIRM RESERVATION</button>
      </form>
    </div>
  </div>

</body>
</html>
